<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2026年3月12日 石墨烯日报 · GrapheneDaily</title>
<link rel="stylesheet" href="../../../css/style.css">
<style>
.daily-page-header{background:var(--gradient-dark);border-bottom:1px solid var(--card-border);padding:40px 24px 32px}
.daily-page-header-inner{max-width:1200px;margin:0 auto}
.dph-breadcrumb{font-size:.82rem;color:var(--text-muted);margin-bottom:16px}
.dph-breadcrumb a{color:var(--text-muted)}
.date-big-display{display:inline-flex;align-items:center;gap:16px;background:rgba(0,198,255,.06);border:1px solid rgba(0,198,255,.2);border-radius:12px;padding:12px 20px;margin-bottom:18px}
.dbd-num{font-size:3rem;font-weight:900;background:var(--gradient);-webkit-background-clip:text;-webkit-text-fill-color:transparent;line-height:1}
.dbd-info{display:flex;flex-direction:column;gap:3px}
.dbd-month{font-size:.85rem;color:var(--text-muted)}
.dbd-weekday{font-size:1rem;color:#fff;font-weight:600}
.daily-page-title{font-size:1.6rem;font-weight:800;color:#fff;margin-bottom:8px}
.daily-page-desc{color:var(--text-muted);font-size:.92rem}
.daily-page-stats{display:flex;gap:20px;margin-top:18px;flex-wrap:wrap}
.dps-item{font-size:.82rem;color:var(--text-muted);display:flex;align-items:center;gap:5px}
.dps-item strong{color:var(--accent)}
.daily-content-area{display:grid;grid-template-columns:1fr 300px;gap:28px;max-width:1200px;margin:0 auto;padding:32px 24px 60px}
@media(max-width:960px){.daily-content-area{grid-template-columns:1fr}}
.full-article{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius);padding:28px;margin-bottom:20px;position:relative;transition:border-color .2s}
.full-article:hover{border-color:rgba(0,198,255,.2)}
.article-num{position:absolute;top:20px;right:20px;font-size:2rem;font-weight:900;color:rgba(255,255,255,.04)}
.article-cat{display:inline-block;border-radius:4px;padding:3px 10px;font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.5px;margin-bottom:4px}
.full-title{font-size:1.15rem;font-weight:700;color:#fff;line-height:1.5;margin-bottom:12px}
.article-meta-bar{display:flex;gap:16px;font-size:.8rem;color:var(--text-muted);margin-bottom:16px;padding-bottom:16px;border-bottom:1px solid var(--card-border)}
.article-body-text p{color:var(--text-muted);font-size:.92rem;line-height:1.75;margin-bottom:14px}
.article-body-text blockquote{border-left:3px solid var(--accent);padding:12px 18px;background:rgba(0,198,255,.04);border-radius:0 8px 8px 0;margin:16px 0;color:var(--text);font-size:.9rem;font-style:italic}
.article-footer-bar{margin-top:18px;padding-top:16px;border-top:1px solid var(--card-border)}
.art-link{font-size:.85rem;color:var(--accent)}
.daily-nav{display:flex;justify-content:space-between;align-items:center;padding:16px 0 0;gap:10px}
.dnav-btn{background:var(--card-bg);border:1px solid var(--card-border);border-radius:var(--radius-sm);padding:8px 18px;font-size:.85rem;color:var(--text-muted);text-decoration:none;display:inline-block;transition:all .2s}
.dnav-btn:hover{color:var(--accent);border-color:var(--accent);background:var(--hover)}
</style>
</head><body>
<nav class="navbar"><div class="navbar-inner"><a href="../../../index.html" class="logo"><div class="logo-icon">⬡</div><div class="logo-text"><span>Graphene</span>Daily</div></a><ul class="nav-links"><li><a href="../../../index.html">首页</a></li><li><a href="../../../archive.html" class="active">归档</a></li><li><a href="../../../about.html">关于</a></li></ul></div></nav>
<div class="daily-page-header"><div class="daily-page-header-inner">
<div class="dph-breadcrumb"><a href="../../../index.html">首页</a> / <a href="../../../archive.html">归档</a> / <span>2026年3月12日</span></div>
<div class="date-big-display"><div class="dbd-num">12</div><div class="dbd-info"><div class="dbd-month">2026年 3月</div><div class="dbd-weekday">周四</div></div></div>
<div class="daily-page-title">石墨烯日报</div><div class="daily-page-desc">全球石墨烯科研、产业及商业化动态汇总</div>
<div class="daily-page-stats" id="stats-bar"></div>
</div></div>
<div class="daily-content-area"><div class="main-content" id="articles-root"></div><aside class="sidebar" id="sidebar-root"></aside></div>
<footer class="footer"><div class="footer-inner"><p class="footer-text">© 2026 GrapheneDaily</p><div class="footer-links"><a href="https://github.com" target="_blank">GitHub</a></div></div></footer>
<script src="../../../js/data.js"></script><script src="../../../js/ui.js"></script>
<script>
const dateStr='2026-03-12';const news=getNewsByDate(dateStr);
const catColors={research:{bg:'rgba(0,255,136,0.08)',color:'#00d68f',label:'科研'},industry:{bg:'rgba(255,196,0,0.08)',color:'#ffc400',label:'产业'},funding:{bg:'rgba(138,43,226,0.1)',color:'#bf7fff',label:'融资'}};
document.getElementById('stats-bar').innerHTML=`<div class="dps-item">共 <strong>${news.length}</strong> 条</div><div class="dps-item">科研 <strong>${news.filter(n=>n.category==='research').length}</strong></div><div class="dps-item">产业 <strong>${news.filter(n=>n.category==='industry').length}</strong></div><div class="dps-item">融资 <strong>${news.filter(n=>n.category==='funding').length}</strong></div>`;
function renderArticle(n,idx){
  const cat=catColors[n.category]||catColors.industry;
  const tagHtml=n.tags.map(t=>{let cls=n.category==='research'?'research':(n.category==='funding'?'funding':'industry');if(t==='热门')cls='hot';return`<span class="tag ${cls}">${t}</span>`}).join('');
  return`<article class="full-article fade-in" style="animation-delay:${idx*0.08}s">
    <div class="article-num">${String(idx+1).padStart(2,'0')}</div>
    <div class="article-cat" style="background:${cat.bg};color:${cat.color};">${cat.label}</div>
    <div class="card-tags" style="margin:10px 0 14px;">${tagHtml}</div>
    <h2 class="full-title">${n.title}</h2>
    <div class="article-meta-bar"><span>📰 ${n.source}</span><span>⏱ ${n.readTime} 阅读</span></div>
    <div class="article-body-text">
      <p>${n.summary}</p>
      <p>石墨烯技术的每一次突破都在推动人类社会向更可持续、更智能的未来迈进。</p>
      <blockquote>"我们正在见证一场新材料革命，石墨烯是这场革命最重要的主角之一。"</blockquote>
    </div>
    <div class="article-footer-bar"><a href="${n.url}" class="art-link" target="_blank">查看原文 →</a></div>
  </article>`;
}
document.getElementById('articles-root').innerHTML=news.map((n,i)=>renderArticle(n,i)).join('')+`<div class="daily-nav"><a href="20260311.html" class="dnav-btn">← 3月11日</a><a href="../../../archive.html" class="dnav-btn">📋 归档</a><a href="20260313.html" class="dnav-btn">3月13日 →</a></div>`;
// 初始化标签过滤功能
initFilterBar(news, '.full-article');

const allTags=[...new Set(news.flatMap(n=>n.tags))];
const weekDays=['2026-03-17','2026-03-16','2026-03-15','2026-03-14','2026-03-13','2026-03-12','2026-03-11'];
document.getElementById('sidebar-root').innerHTML=`
<div class="sidebar-card"><div class="sidebar-title">今日摘要</div>
<div style="display:flex;flex-direction:column;gap:8px;">
<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--card-border)"><span style="color:var(--text-muted)">科研</span><span style="color:#00d68f;font-weight:600">${news.filter(n=>n.category==='research').length}</span></div>
<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:8px 0;border-bottom:1px solid var(--card-border)"><span style="color:var(--text-muted)">产业</span><span style="color:#ffc400;font-weight:600">${news.filter(n=>n.category==='industry').length}</span></div>
<div style="display:flex;justify-content:space-between;font-size:.85rem;padding:8px 0"><span style="color:var(--text-muted)">融资</span><span style="color:#bf7fff;font-weight:600">${news.filter(n=>n.category==='funding').length}</span></div>
</div></div>
<div class="sidebar-card"><div class="sidebar-title">标签云</div>
<div style="display:flex;flex-wrap:wrap;gap:6px;">${allTags.map(t=>`<span style="background:var(--tag-bg);border:1px solid rgba(0,198,255,0.15);border-radius:4px;padding:3px 9px;font-size:.75rem;color:var(--accent)">${t}</span>`).join('')}</div>
</div>
<div class="sidebar-card"><div class="sidebar-title">本周导航</div>
<div style="display:flex;flex-direction:column;gap:6px;">
${weekDays.map(dd=>{const dn=getNewsByDate(dd);const isAct=dd===dateStr;const y2=dd.substring(0,4),m2=dd.substring(5,7),d2=dd.substring(8,10);return`<a href="../../../news/${y2}/${m2}/${y2}${m2}${d2}.html" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:${isAct?'rgba(0,198,255,0.08)':'transparent'};border:1px solid ${isAct?'rgba(0,198,255,0.3)':'var(--card-border)'};border-radius:6px;text-decoration:none;color:${isAct?'var(--accent)':'var(--text-muted)'};font-size:.82rem"><span>${formatDate(dd,'short')}</span><span style="font-size:.75rem">${dn.length}条</span></a>`}).join('')}
</div></div>`;
</script>
</body></html>
