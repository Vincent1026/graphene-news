    .dnav-btn { background:var(--card-bg); border:1px solid var(--card-border); border-radius:var(--radius-sm); padding:8px 18px; font-size:0.85rem; color:var(--text-muted); cursor:pointer; transition:all 0.2s; text-decoration:none; display:inline-block; }
    .dnav-btn:hover { color:var(--accent); border-color:var(--accent); background:var(--hover); }
    .today-badge { display:inline-flex; align-items:center; gap:6px; background:rgba(0,198,255,0.12); border:1px solid rgba(0,198,255,0.3); border-radius:50px; padding:4px 12px; font-size:0.78rem; color:var(--accent); margin-bottom:12px; }

<script>
const dateStr = '2026-03-17';
const news = getNewsByDate(dateStr);
const catColors = {
  research: { bg: 'rgba(0,255,136,0.08)', color: '#00d68f', label: '科研' },
  industry: { bg: 'rgba(255,196,0,0.08)', color: '#ffc400', label: '产业' },
  funding:  { bg: 'rgba(138,43,226,0.1)',  color: '#bf7fff', label: '融资' }
};

function renderArticle(n, idx) {
  const cat = catColors[n.category] || catColors.industry;
  const tagHtml = n.tags.map(t => {
    let cls = n.category === 'research' ? 'research' : (n.category === 'funding' ? 'funding' : 'industry');
    if (t === '热门') cls = 'hot';
    return `<span class="tag ${cls}">${t}</span>`;
  }).join('');
  return `<article class="full-article fade-in" style="animation-delay:${idx*0.08}s">
    <div class="article-num">${String(idx+1).padStart(2,'0')}</div>
    <div class="article-cat" style="background:${cat.bg};color:${cat.color};">${cat.label}</div>
    <div class="card-tags" style="margin:10px 0 14px;">${tagHtml}</div>
    <h2 class="full-title">${n.title}</h2>
    <div class="article-meta-bar">
      <span>📰 ${n.source}</span>
      <span>⏱ ${n.readTime} 阅读</span>
    </div>
    <div class="article-body-text">
      <p>${n.summary}</p>
      <p>石墨烯作为一种由碳原子构成的二维单层蜂窝状晶格材料，其卓越的导电性（~2×10⁵ cm²/V·s 电子迁移率）、导热率（~5000 W/mK）以及出色的机械强度（~1 TPa 弹性模量），使其成为21世纪最受关注的新型功能材料之一。本条新闻代表了该领域的最新重要进展。</p>
      <blockquote>"我们正站在石墨烯技术商业化的临界点上，未来五年将见证其真正走入大规模应用。" — 石墨烯旗舰计划首席科学家</blockquote>
      <p>随着制备工艺的持续突破和成本的进一步降低，石墨烯在电子、能源、医疗及航空航天等领域的应用前景愈发清晰。研究人员和产业界人士对其未来十年的市场潜力充满信心。</p>
    </div>
    <div class="article-footer-bar">
      <a href="${n.url}" class="art-link" target="_blank">查看原文 →</a>
    </div>
  </article>`;
}

document.getElementById('articles-root').innerHTML = 
  news.map((n, i) => renderArticle(n, i)).join('') +
  `<div class="daily-nav">
    <a href="20260316.html" class="dnav-btn">← 3月16日</a>
    <a href="../../../archive.html" class="dnav-btn">📋 全部归档</a>
    <span></span>
  </div>`;

// 侧边栏
const allTags = [...new Set(news.flatMap(n => n.tags))];
const weekDays = ['2026-03-17','2026-03-16','2026-03-15','2026-03-14','2026-03-13','2026-03-12','2026-03-11'];
document.getElementById('sidebar-root').innerHTML = `
  <div class="sidebar-card">
    <div class="sidebar-title">今日摘要</div>
    <div style="display:flex;flex-direction:column;gap:8px;">
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:8px 0;border-bottom:1px solid var(--card-border)">
        <span style="color:var(--text-muted)">科研突破</span><span style="color:#00d68f;font-weight:600">${news.filter(n=>n.category==='research').length}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:8px 0;border-bottom:1px solid var(--card-border)">
        <span style="color:var(--text-muted)">产业动态</span><span style="color:#ffc400;font-weight:600">${news.filter(n=>n.category==='industry').length}</span>
      </div>
      <div style="display:flex;justify-content:space-between;font-size:0.85rem;padding:8px 0">
        <span style="color:var(--text-muted)">融资事件</span><span style="color:#bf7fff;font-weight:600">${news.filter(n=>n.category==='funding').length}</span>
      </div>
    </div>
  </div>
  <div class="sidebar-card">
    <div class="sidebar-title">标签云</div>
    <div style="display:flex;flex-wrap:wrap;gap:6px;">
      ${allTags.map(t=>`<span style="background:var(--tag-bg);border:1px solid rgba(0,198,255,0.15);border-radius:4px;padding:3px 9px;font-size:0.75rem;color:var(--accent)">${t}</span>`).join('')}
    </div>
  </div>
  <div class="sidebar-card">
    <div class="sidebar-title">本周导航</div>
    <div style="display:flex;flex-direction:column;gap:6px;">
      ${weekDays.map(dd=>{
        const dn = getNewsByDate(dd);
        const isAct = dd === dateStr;
        const y2=dd.substring(0,4),m2=dd.substring(5,7),d2=dd.substring(8,10);
        return `<a href="../../../news/${y2}/${m2}/${y2}${m2}${d2}.html" style="display:flex;justify-content:space-between;align-items:center;padding:8px 10px;background:${isAct?'rgba(0,198,255,0.08)':'transparent'};border:1px solid ${isAct?'rgba(0,198,255,0.3)':'var(--card-border)'};border-radius:6px;text-decoration:none;color:${isAct?'var(--accent)':'var(--text-muted)'};font-size:0.82rem;transition:all 0.2s">
          <span>${formatDate(dd,'short')}</span>
          <span style="font-size:0.75rem">${dn.length}条</span>
        </a>`;
      }).join('')}
    </div>
  </div>`;
</script>
