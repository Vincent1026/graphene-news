<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GrapheneDaily · 石墨烯资讯</title>
  <meta name="description" content="每日追踪全球石墨烯最新研究成果、产业动态与商业化进展">
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <style>
    .today-chip {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: rgba(0,198,255,0.1);
      border: 1px solid rgba(0,198,255,0.25);
      border-radius: 4px;
      padding: 3px 10px;
      font-size: 0.78rem;
      color: var(--accent);
      margin-bottom: 10px;
    }
    .archive-quick { 
      display: flex; 
      gap: 10px; 
      flex-wrap: wrap;
      margin: 16px 0 32px;
    }
    .archive-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius-sm);
      padding: 8px 18px;
      color: var(--text-muted);
      font-size: 0.88rem;
      cursor: pointer;
      transition: all 0.2s;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }
    .archive-btn:hover {
      color: var(--accent);
      border-color: var(--accent);
      background: var(--hover);
    }
    .archive-btn .btn-icon { font-size: 1rem; }
    .week-preview {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: var(--radius);
      padding: 24px;
      margin-bottom: 32px;
    }
    .week-preview-title {
      font-size: 0.88rem;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.8px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .week-preview-title a { font-size: 0.82rem; color: var(--text-muted); }
    .week-preview-title a:hover { color: var(--accent); }
    .days-row {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 6px;
    }
    .day-cell {
      background: rgba(255,255,255,0.02);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 10px 6px;
      text-align: center;
      cursor: pointer;
      transition: all 0.2s;
    }
    .day-cell:hover { border-color: rgba(0,198,255,0.3); background: var(--hover); }
    .day-cell.active-day {
      border-color: var(--accent);
      background: rgba(0,198,255,0.08);
    }
    .day-cell.no-news { opacity: 0.4; cursor: default; }
    .day-cell .dc-label { font-size: 0.65rem; color: var(--text-muted); margin-bottom: 2px; }
    .day-cell .dc-num { font-size: 1rem; font-weight: 700; color: #fff; }
    .day-cell .dc-count { font-size: 0.65rem; color: var(--text-muted); margin-top: 3px; }
    .day-cell.active-day .dc-count { color: var(--accent); }
    .day-cell .dc-dot {
      width: 4px; height: 4px;
      background: var(--accent);
      border-radius: 50%;
      margin: 3px auto 0;
      display: none;
    }
    .day-cell.has-news .dc-dot { display: block; }
    @media (max-width: 600px) {
      .days-row { grid-template-columns: repeat(4, 1fr); }
    }
    .stats-bar {
      display: flex;
      gap: 24px;
      padding: 20px 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 32px;
      overflow-x: auto;
    }
    .stat-box {
      flex-shrink: 0;
      text-align: center;
    }
    .stat-box .s-num { 
      font-size: 1.6rem; 
      font-weight: 800;
      background: var(--gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .stat-box .s-label { font-size: 0.78rem; color: var(--text-muted); margin-top: 2px; }
  </style>
</head>
<body>

<div id="navbar-root"></div>

<!-- Hero -->
<section class="hero">
  <div class="hero-inner">
    <div class="hero-badge">实时更新</div>
    <h1>全球<span>石墨烯</span>资讯<br>每日追踪</h1>
    <p class="hero-desc">汇聚 Nature、Science、Graphene-Info 等权威来源，实时追踪全球石墨烯最新科研突破与产业动态。</p>
    <div class="hero-date">今日：<strong id="today-display"></strong> · 当日新闻 <strong id="today-count"></strong> 条</div>
  </div>
</section>

<div class="container">

  <!-- 本周速览 -->
  <div class="week-preview fade-in" style="margin-top:32px;">
    <div class="week-preview-title">
      <span>📅 本周速览</span>
      <a href="archive.html">查看完整归档 →</a>
    </div>
    <div class="days-row" id="week-days-row"></div>
  </div>

  <!-- 快速跳转按钮 -->
  <div class="archive-quick fade-in fade-in-delay-1">
    <a href="archive.html" class="archive-btn"><span class="btn-icon">📆</span>按年归档</a>
    <a href="archive.html#month-2026-03" class="archive-btn"><span class="btn-icon">🗓</span>本月新闻</a>
    <a href="archive.html#week-11" class="archive-btn"><span class="btn-icon">📋</span>本周新闻</a>
    <a href="news/2026/03/20260317.html" class="archive-btn" style="border-color: rgba(0,198,255,0.4); color: var(--accent);"><span class="btn-icon">⚡</span>今日日报</a>
  </div>

  <!-- 统计数字 -->
  <div class="stats-bar fade-in fade-in-delay-1">
    <div class="stat-box"><div class="s-num">8</div><div class="s-label">追踪天数</div></div>
    <div class="stat-box"><div class="s-num">38</div><div class="s-label">新闻总量</div></div>
    <div class="stat-box"><div class="s-num">12</div><div class="s-label">科研突破</div></div>
    <div class="stat-box"><div class="s-num">16</div><div class="s-label">产业动态</div></div>
    <div class="stat-box"><div class="s-num">4</div><div class="s-label">融资事件</div></div>
    <div class="stat-box"><div class="s-num">6</div><div class="s-label">来源渠道</div></div>
  </div>

  <!-- 今日焦点 -->
  <div class="section-header fade-in">
    <div class="section-title">今日焦点</div>
    <a href="news/2026/03/20260317.html" class="section-more">查看全部今日新闻</a>
  </div>

  <div id="featured-grid" class="news-grid featured fade-in fade-in-delay-1"></div>

  <!-- 今日更多 -->
  <div class="section-header fade-in">
    <div class="section-title">今日更多</div>
  </div>
  <div id="more-news-list" class="fade-in fade-in-delay-2"></div>

  <!-- 昨日回顾 -->
  <div class="section-header fade-in" style="margin-top:48px;">
    <div class="section-title">昨日回顾</div>
    <a href="news/2026/03/20260316.html" class="section-more">查看 3月16日全部</a>
  </div>
  <div id="yesterday-grid" class="news-grid fade-in fade-in-delay-1"></div>

  <!-- 更早新闻 -->
  <div class="section-header fade-in" style="margin-top:48px;">
    <div class="section-title">近期精选</div>
    <a href="archive.html" class="section-more">完整归档</a>
  </div>
  <div id="recent-list" class="news-list fade-in fade-in-delay-2"></div>

</div>

<div id="footer-root"></div>

<script src="js/data.js"></script>
<script src="js/ui.js"></script>
<script>
  // 注入导航和页脚
  document.getElementById('navbar-root').innerHTML = renderNavbarHome('home');
  document.getElementById('footer-root').innerHTML = renderFooter().replace(/href="index.html"/g, 'href="index.html"');

  const today = getTodayStr();
  const todayNews = getNewsByDate(today);
  const yesterday = '2026-03-16';

  // 今日日期显示
  document.getElementById('today-display').textContent = formatDate(today);
  document.getElementById('today-count').textContent = todayNews.length;

  // 本周日历（3月11-17）
  const weekDays = [
    { date: '2026-03-11', label: '周三' },
    { date: '2026-03-12', label: '周四' },
    { date: '2026-03-13', label: '周五' },
    { date: '2026-03-14', label: '周六' },
    { date: '2026-03-15', label: '周日' },
    { date: '2026-03-16', label: '周一' },
    { date: '2026-03-17', label: '周二' },
  ];
  document.getElementById('week-days-row').innerHTML = weekDays.map(wd => {
    const news = getNewsByDate(wd.date);
    const dayNum = wd.date.split('-')[2];
    const isToday = wd.date === today;
    const hasNews = news.length > 0;
    const year = wd.date.substring(0,4);
    const mon  = wd.date.substring(5,7);
    const day  = wd.date.substring(8,10);
    const link = `news/${year}/${mon}/${year}${mon}${day}.html`;
    return `<div class="day-cell ${isToday?'active-day':''} ${hasNews?'has-news':''}" 
                 onclick="location.href='${link}'" title="${wd.date} · ${news.length}条新闻">
      <div class="dc-label">${wd.label}</div>
      <div class="dc-num">${parseInt(dayNum)}</div>
      ${hasNews ? `<div class="dc-count">${news.length}条</div>` : '<div class="dc-count">-</div>'}
      <div class="dc-dot"></div>
    </div>`;
  }).join('');

  // 今日焦点（置顶 + 第二条）
  const featured = getFeaturedNews(today);
  const rest = todayNews.filter(n => !n.featured);
  let featuredHtml = '';
  if (featured) featuredHtml += renderNewsCard(featured, 'featured');
  if (rest[0])  featuredHtml += renderNewsCard(rest[0]);
  document.getElementById('featured-grid').innerHTML = featuredHtml;

  // 今日更多列表
  const moreNews = rest.slice(1);
  document.getElementById('more-news-list').innerHTML = 
    `<div class="news-list">${moreNews.map((n, i) => renderNewsListItem(n, i, today)).join('')}</div>`;

  // 昨日回顾（前3条卡片）
  const yesterdayNews = getNewsByDate(yesterday).slice(0, 3);
  document.getElementById('yesterday-grid').innerHTML = yesterdayNews.map(n => renderNewsCard(n)).join('');

  // 近期精选（3月15日及更早，取前6条）
  const recentDates = ['2026-03-15', '2026-03-14', '2026-03-13'];
  const recentNews = recentDates.flatMap(d => getNewsByDate(d)).slice(0, 6);
  document.getElementById('recent-list').innerHTML = 
    recentNews.map((n, i) => {
      const d = n.id.substring(0,4)+'-'+n.id.substring(4,6)+'-'+n.id.substring(6,8);
      return renderNewsListItem(n, i, d);
    }).join('');
</script>
</body>
</html>
